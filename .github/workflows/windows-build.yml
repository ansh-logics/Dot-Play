# Test builds for Windows. Runs on the windows-port branch (or by hand) and uploads the
# installer as a workflow artifact. Nothing is published and nothing is signed for updates;
# releases come from windows-release.yml.
name: Windows build

on:
  push:
    branches: [windows-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: dot-music-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
