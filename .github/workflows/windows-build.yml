# Test builds for Windows. Runs on the windows-port branch only and uploads the installer as a
# workflow artifact. Nothing is published as a release, so the Mac app's updates
# (releases/latest/download/latest.json) are untouched.
name: Windows build

on:
  push:
    branches: [windows-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: dot-music-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
