# Checks every push to main and every pull request: lint, types, unit tests, builds, the relay
# end to end, and the Rust tests on both macOS and Windows (so a Windows-only break shows up
# here, not when a release builds). Nothing is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Checks only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: App, phone page, site and relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
            relay/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint the Mac install script
        run: shellcheck -S warning site/public/install.sh

      - name: Types
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Build the app
        run: npx vite build

      - name: Build the phone page
        run: npx vite build -c vite.remote.config.ts

      - name: Build the website
        working-directory: site
        run: |
          npm ci
          npx tsc -b
          npx vite build

      - name: Relay types
        working-directory: relay
        run: |
          npm ci
          npx tsc --noEmit

      - name: Relay end to end
        working-directory: relay
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx wrangler dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/ > /dev/null && break
            sleep 1
          done
          npm run test:e2e || { cat wrangler.log; exit 1; }

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The app embeds the built frontend, so it has to exist before Rust compiles.
      - name: Build the frontend
        run: npx vite build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Downloads the latest release and checks its signature, as a visitor's Mac would;
      # installs nothing.
      - name: Mac install script (dry run)
        if: runner.os == 'macOS'
        env:
          DOT_INSTALL_DRY_RUN: "1"
        run: sh site/public/install.sh
