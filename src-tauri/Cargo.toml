[package]
name = "dot-music"
version = "1.2.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json"] }
sha1 = "0.10"
tauri-plugin-localhost = "2"
portpicker = "0.1"
tokio = { version = "1", features = ["time", "macros", "net", "io-util", "sync", "rt"] }
getrandom = "0.3"
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSHTTPCookie", "NSArray", "NSString", "NSDictionary", "NSValue", "NSData"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKHTTPCookieStore"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSHapticFeedback", "NSImage", "NSPanel", "NSWindow", "NSResponder", "NSGraphics", "NSEvent", "NSApplication", "block2"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPNowPlayingInfoCenter", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPMediaItem"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
