<!doctype html>
<!-- The social preview card (1200×630). Rendered to public/og.png by `npm run og`. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Inter:wght@500;600;700&display=block" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; color: #f5f5f7; }
      body { position: relative; font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
      .grid {
        position: absolute; inset: 0;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.14) 1.1px, transparent 1.6px);
        background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(60% 80% at 22% 50%, #000, transparent);
      }
      .glow {
        position: absolute; width: 760px; height: 520px; right: -140px; top: 90px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(215, 25, 33, 0.28), transparent 70%);
        filter: blur(30px);
      }
      .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 480px; display: flex; flex-direction: column; justify-content: center; }
      .logo { display: flex; align-items: center; font-family: Doto, monospace; font-weight: 800; font-size: 30px; }
      .logo i { width: 9px; height: 9px; margin: 0 4px; border-radius: 50%; background: #d71921; box-shadow: 0 0 12px rgba(215, 25, 33, 0.7); }
      h1 { margin: 34px 0 0; font-family: Doto, monospace; font-weight: 800; font-size: 60px; line-height: 1; letter-spacing: 0.01em; }
      h1 b { color: #d71921; }
      p { margin: 24px 0 0; font-size: 23px; line-height: 1.45; color: rgba(245, 245, 247, 0.66); }
      .pill {
        margin-top: 34px; align-self: flex-start; padding: 13px 22px; border-radius: 999px;
        background: #d71921; font-weight: 700; font-size: 19px; color: #fff;
      }
      .stage { position: absolute; left: 556px; top: 92px; width: 760px; perspective: 1600px; }
      .shot {
        width: 760px; aspect-ratio: 2000 / 1256; border-radius: 16px; overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 40px 90px -20px rgba(0, 0, 0, 0.95);
        transform: rotateY(-14deg) rotateX(4deg); transform-origin: 0 50%;
      }
      .shot img { width: 100%; height: 100%; display: block; object-fit: cover; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="copy">
      <div class="logo">dot(<i></i>)music</div>
      <h1>Your music<b>.</b><br />Every mood<b>.</b></h1>
      <p>A free, open-source YouTube Music player made for the Mac.</p>
      <div class="pill">Download for macOS</div>
    </div>
    <div class="stage">
      <div class="shot"><img src="/shots/app-lyrics.jpg" alt="" /></div>
    </div>
  </body>
</html>
